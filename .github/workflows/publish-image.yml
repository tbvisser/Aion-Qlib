# Publishes the dev image so a second machine can `docker compose pull` instead of
# spending 5-8 minutes building. docker-compose.yml defaults to the tag this pushes.
#
# Runners are amd64, so linux/amd64 is built natively and linux/arm64 under QEMU
# (slower, but only here in CI -- never on anyone's laptop).
name: Publish dev image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.dev
      - Dockerfile.dev.dockerignore
      - docker/**
      - pyproject.toml
      - webapp/requirements.txt
      - webapp/requirements-dev.txt
      - .github/workflows/publish-image.yml
  workflow_dispatch:

concurrency:
  group: publish-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Dockerfile.dev pins SETUPTOOLS_SCM_PRETEND_VERSION because .git is
          # excluded from the build context, so no tag history is needed here.
          fetch-depth: 1

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aion-qlib
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must never contain webapp/.env. Dockerfile.dev.dockerignore
      # excludes it, but that file is one careless edit away from being wrong and
      # this is a public-ish registry, so fail the build rather than trust it.
      - name: Assert no secrets baked into the image
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/aion-qlib:dev"
          docker pull --platform linux/amd64 "$image"
          if docker run --rm --entrypoint sh "$image" -c 'test -e /qlib/webapp/.env'; then
            echo "::error::webapp/.env is present in the image -- secrets would leak."
            exit 1
          fi
          echo "OK: no webapp/.env in the image."
