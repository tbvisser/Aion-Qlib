name: Custom factors (momentum, vol, price-volume)
model: lightgbm
handler: Alpha158
data_store: us
universe: macro50
benchmark: SPY
train_start: '2010-01-04'
train_end: '2019-12-31'
valid_start: '2020-01-01'
valid_end: '2021-12-31'
test_start: '2022-01-01'
test_end: '2026-07-31'
topk: 50
n_drop: 5
open_cost: 0.0005
close_cost: 0.0015
min_cost: 5.0
account: 100000000.0
limit_threshold: null
features:
- name: MOM5
  expression: Ref($close, 5)/$close - 1
- name: VOLA20
  expression: Std($close, 20)/Mean($close, 20)
- name: PVCORR20
  expression: Corr($close, Log($volume + 1), 20)
feature_mode: extend
id: demo-custom-factors
created_at: '2026-08-10T15:12:08.562855+00:00'
updated_at: '2026-08-10T15:49:02.739992+00:00'
