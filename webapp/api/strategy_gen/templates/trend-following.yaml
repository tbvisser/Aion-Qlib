id: trend-following
title: Trend Following
family: factors
tags: [trend, multi-horizon, alpha158]

rationale: >
  Multi-horizon trend signal. Adds 1-month, 3-month, 6-month and 12-month momentum
  so the model can learn how different horizons weigh into future returns.

good_for:
  - A diversified trend signal across time scales
  - Regimes where trend persists at multiple horizons

bad_for:
  - Choppy markets where horizons disagree
  - The first year of data; the 12-month column needs a full year to warm up

draft:
  name: Trend Following
  model: lightgbm
  handler: Alpha158
  universe: top500
  topk: 40
  n_drop: 5
  feature_mode: extend
  features:
    - name: MOM_1M
      expression: "$close/(Ref($close,21)+1e-12) - 1"
    - name: MOM_3M
      expression: "$close/(Ref($close,63)+1e-12) - 1"
    - name: MOM_6M
      expression: "$close/(Ref($close,126)+1e-12) - 1"
    - name: MOM_12M
      expression: "$close/(Ref($close,252)+1e-12) - 1"
