id: high-turnover-costs
title: High turnover meeting real costs
family: cost
tags: [costs, turnover, stress]

rationale: >
  Replaces half the book every day and charges a stressed fee for doing it. The
  two choices are combined on purpose: turnover and cost only matter together,
  and a template that varied one without the other would understate both.

good_for:
  - Showing where a fast signal stops paying for its own trading
  - A deliberately unflattering run to put beside the zero-cost ceiling

bad_for:
  - Judging the signal itself, which this is designed to bury
  - Slow strategies, where nothing here is binding
