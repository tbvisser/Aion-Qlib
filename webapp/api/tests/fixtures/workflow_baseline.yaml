qlib_init:
  provider_uri: /tmp/store-us
  region: us
market: top500
benchmark: SPY
data_handler_config: &id001
  start_time: '2010-01-04'
  end_time: '2026-08-07'
  fit_start_time: '2010-01-04'
  fit_end_time: '2019-12-31'
  instruments: top500
port_analysis_config: &id002
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 50
      n_drop: 5
  backtest:
    start_time: '2022-01-01'
    end_time: '2026-08-07'
    account: 100000000
    benchmark: SPY
    exchange_kwargs:
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5.0
task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      colsample_bytree: 0.8879
      learning_rate: 0.0421
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 20
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158
        module_path: qlib.contrib.data.handler
        kwargs: *id001
      segments:
        train:
        - '2010-01-04'
        - '2019-12-31'
        valid:
        - '2020-01-01'
        - '2021-12-31'
        test:
        - '2022-01-01'
        - '2026-08-07'
  record:
  - class: SignalRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      model: <MODEL>
      dataset: <DATASET>
  - class: SigAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      ana_long_short: false
      ann_scaler: 252
  - class: PortAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      config: *id002
