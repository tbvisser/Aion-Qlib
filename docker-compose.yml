# Local development stack for this qlib checkout (compose project: qlib).
# Separate from the upstream Dockerfile / build_docker_image.sh, which exist to
# publish a PyPI-based image to Docker Hub.
#
#   docker compose pull                # fetch the published image (fast path)
#   docker compose build qlib          # ...or build it yourself, ~5-8 min
#   docker compose up -d               # qlib-dev + qlib-mlflow-ui appear in `docker ps`
#   docker compose exec qlib bash      # shell in the container
#   docker compose exec -w /qlib/examples qlib \
#       qrun benchmarks/LightGBM/workflow_config_lightgbm_Alpha158.yaml
#   open http://localhost:5500         # MLflow UI over the runs qrun produced
#   open http://localhost:8888/lab?token=qlib   # JupyterLab for strategy analysis
#   open http://localhost:5274         # AION (the web app)
#
# The repo is bind-mounted, so host edits are live inside the container via the
# editable install. ~/.qlib is shared, so host and container use one dataset.
#
# First run on a new machine: see ONBOARDING.md. Requires Compose v2.24+ for the
# optional `env_file` form used below.
#
# AION_IMAGE selects which image the four python services run. The default is the
# one CI publishes to GHCR; `AION_IMAGE=qlib-dev:local` pins to your own build.
# DOCKER_UID/DOCKER_GID matter on Linux only — see .env.example.
#
# The data mount lands on /home/qlib/.qlib rather than /root/.qlib, and HOME is
# set to match, so that `~/.qlib` still resolves when DOCKER_UID makes these
# services run as a non-root user (/root is mode 700 and unreadable to them).

services:
  qlib:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: ${AION_IMAGE:-ghcr.io/tbvisser/aion-qlib:dev}
    container_name: qlib-dev
    working_dir: /qlib
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    environment:
      HOME: /home/qlib
    volumes:
      - .:/qlib
      - ${HOME}/.qlib:/home/qlib/.qlib
    # Keep the container alive so it is usable via `docker compose exec`.
    stdin_open: true
    tty: true
    command: bash

  # AION API. Same image as qlib-dev; it needs the repo (editable
  # install), ~/.qlib (market data) and webapp/.env (EODHD + OpenRouter keys,
  # which stay server-side and never reach the browser).
  api:
    image: ${AION_IMAGE:-ghcr.io/tbvisser/aion-qlib:dev}
    container_name: qlib-api
    depends_on:
      - qlib
    working_dir: /qlib
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    environment:
      HOME: /home/qlib
    # The keys are read at runtime, never baked into the image — see the secrets
    # block in Dockerfile.dev.dockerignore. Optional so that `compose up` still
    # works on a fresh clone before you have written webapp/.env.
    env_file:
      - path: webapp/.env
        required: false
    volumes:
      - .:/qlib
      - ${HOME}/.qlib:/home/qlib/.qlib
    ports:
      - "127.0.0.1:8770:8770"
    command:
      - uvicorn
      - webapp.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8770"

  # Vite dev server. Proxies /api to the api service (VITE_API_PROXY overrides
  # the localhost default from vite.config.ts, since inside the network the API
  # is reachable by service name rather than on 127.0.0.1).
  ui:
    image: node:22-alpine
    container_name: qlib-ui
    depends_on:
      - api
    working_dir: /app
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    volumes:
      - ./webapp/ui:/app
    environment:
      VITE_API_PROXY: http://api:8770
      VITE_RAG_API_PROXY: http://rag-api:8001
      # node:22-alpine defaults HOME to /root, which a non-root DOCKER_UID cannot
      # write; without these npm install fails on its cache before it starts.
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    ports:
      - "127.0.0.1:5274:5274"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # Interactive frontend for strategy work: run a backtest, then chart it with
  # qlib.contrib.report (cumulative return, risk analysis, IC, positions).
  # Start from examples/workflow_by_code.ipynb.
  jupyter:
    image: ${AION_IMAGE:-ghcr.io/tbvisser/aion-qlib:dev}
    container_name: qlib-jupyter
    depends_on:
      - qlib
    working_dir: /qlib
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    env_file:
      - path: webapp/.env
        required: false
    volumes:
      - .:/qlib
      - ${HOME}/.qlib:/home/qlib/.qlib
    environment:
      HOME: /home/qlib
      # Fixed token so the URL stays stable across restarts. Safe here only
      # because the port below is bound to 127.0.0.1 and is not reachable
      # from the network; change it if you ever publish this on 0.0.0.0.
      JUPYTER_TOKEN: qlib
    ports:
      - "127.0.0.1:8888:8888"
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --ServerApp.root_dir=/qlib

  # Vendored Aion-RAG backend (documents/RAG/chat engine behind the Knowledge
  # tabs). Deliberately its own image: its fastapi/uvicorn pins conflict with
  # the qlib API's, and docling's native parsers stay isolated from backtests.
  # Talks to the supabase-aq stack (external compose project at
  # C:\Users\TBVis\Supabase\supabase-project, Kong on host :8010) via
  # host.docker.internal, and to host Ollama (:11434) for embeddings.
  # Config: rag/backend/.env (gitignored). Rebuild only when
  # rag/backend/requirements.txt changes.
  rag-api:
    build:
      context: ./rag/backend
    image: ${AION_RAG_IMAGE:-aion-rag:dev}
    container_name: qlib-rag-api
    working_dir: /rag/backend
    environment:
      HOME: /home/rag
      # docling layout/table + OCR models download here on first ingest; the
      # named volume makes that a one-time cost.
      HF_HOME: /home/rag/.cache/huggingface
    env_file:
      - path: rag/backend/.env
        required: false
    volumes:
      - ./rag:/rag
      - rag-model-cache:/home/rag/.cache
    ports:
      - "127.0.0.1:8001:8001"

  mlflow-ui:
    image: ${AION_IMAGE:-ghcr.io/tbvisser/aion-qlib:dev}
    container_name: qlib-mlflow-ui
    depends_on:
      - qlib
    working_dir: /qlib
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    environment:
      HOME: /home/qlib
    volumes:
      - .:/qlib
    # Host 5000 is occupied by macOS ControlCenter (AirPlay), hence 5500.
    ports:
      - "5500:5000"
    command:
      - mlflow
      - ui
      - --backend-store-uri
      - file:///qlib/examples/mlruns
      - --host
      - 0.0.0.0
      - --port
      - "5000"

  # Vibe-Trading sidecar (HKUDS/Vibe-Trading, MIT — THIRD_PARTY_NOTICES.md).
  # Own image for the same reason as rag-api: its LangChain-era dependency tree
  # conflicts with the qlib image's pins. The qlib API proxies a whitelisted
  # subset at /api/vibe/* (webapp/api/routers/vibe.py); live order placement is
  # deliberately not in that whitelist. Config: vibe/.env (gitignored) — its
  # API_AUTH_KEY must match VIBE_API_TOKEN in webapp/.env, because the proxy
  # connects over the docker network and vibe rejects non-loopback callers
  # without a key. State persists in vibe-home (~/.vibe-trading).
  vibe-api:
    build:
      context: ./vibe
    image: ${AION_VIBE_IMAGE:-aion-vibe:dev}
    container_name: qlib-vibe-api
    env_file:
      - path: vibe/.env
        required: false
    volumes:
      - vibe-home:/home/vibe
    ports:
      - "127.0.0.1:8899:8000"
    # Mirrors upstream's own compose hardening — this container will eventually
    # hold broker credentials. (No read-only rootfs yet: write paths outside
    # ~/.vibe-trading are unverified; revisit after first bring-up.)
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2
    command:
      - vibe-trading
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      # Loopback requests pass vibe's peer-IP check without a key, so this
      # works before vibe/.env exists.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Same image, MCP transport: 64 read-only research/trading tools over
  # streamable HTTP at http://vibe-mcp:8900/mcp. Internal-only (no host port);
  # consumers are the qlib API proxy and, in a later phase, rag-api. The
  # allowed-hosts env answers vibe's DNS-rebinding guard for the service name.
  vibe-mcp:
    image: ${AION_VIBE_IMAGE:-aion-vibe:dev}
    container_name: qlib-vibe-mcp
    depends_on:
      - vibe-api
    env_file:
      - path: vibe/.env
        required: false
    environment:
      VIBE_TRADING_MCP_ALLOWED_HOSTS: vibe-mcp,localhost,127.0.0.1
    volumes:
      - vibe-home:/home/vibe
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2
    command:
      - vibe-trading-mcp
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "8900"

volumes:
  rag-model-cache:
  vibe-home:
