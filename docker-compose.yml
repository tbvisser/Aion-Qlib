# AION platform: API, UI, and the sidecars the API talks to.
#
#   docker compose up -d          # api + ui + rag + vibe + agent
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d aion-mcp hermes-gateway
#   docker compose exec api bash  # shell in the backend (qlib is already here)
#
# Project name aion-qlib matches infra/supabase/ so Docker Desktop groups
# Studio, Kong, Postgres and these under one heading. They stay two compose
# files: start Supabase first (`infra\stack.ps1 up` does that, waits for
# Postgres, then starts these). Both share aion-qlib_default, so DATABASE_URL
# can use host supabase-db-aq.
#
# Qlib itself runs inside `api` (editable install). Vibe and RAG cannot: their
# Python pins conflict with the qlib image, so they are sibling containers the
# API reaches by service name. The scalability agent is the same image as api
# and consumes jobs the API enqueues.
#
#   open http://localhost:5274         # AION UI
#   open http://localhost:8770/api/health
#   open http://localhost:8010         # Supabase Studio / Kong
#
# The repo is bind-mounted, so host edits are live inside the container via the
# editable install. ~/.qlib is shared, so host and container use one dataset.
#
# First run on a new machine: see ONBOARDING.md. Requires Compose v2.24+ for the
# optional `env_file` form used below.
#
# AION_IMAGE selects which image the backend runs. The default is the one CI
# publishes to GHCR; `AION_IMAGE=qlib-dev:local` pins to your own build.
# DOCKER_UID/DOCKER_GID matter on Linux only — see .env.example.

name: aion-qlib

services:
  # AION API. Built from Dockerfile.dev unless AION_IMAGE points to a published
  # image. Needs the repo (editable install), ~/.qlib (market data) and
  # webapp/.env (EODHD + OpenRouter keys, which stay server-side and never reach
  # the browser).
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: ${AION_IMAGE:-ghcr.io/tbvisser/aion-qlib:dev}
    container_name: qlib-api
    working_dir: /qlib
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    environment:
      HOME: /home/qlib
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: webapp/.env
        required: false
    volumes:
      - .:/qlib
      - ${HOME}/.qlib:/home/qlib/.qlib
    ports:
      - "127.0.0.1:8770:8770"
    command:
      - uvicorn
      - webapp.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8770"

  # Vite dev server. Proxies /api to the api service (VITE_API_PROXY overrides
  # the localhost default from vite.config.ts, since inside the network the API
  # is reachable by service name rather than on 127.0.0.1).
  ui:
    image: node:22-alpine
    container_name: qlib-ui
    depends_on:
      - api
    working_dir: /app
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    volumes:
      - ./webapp/ui:/app
    environment:
      VITE_API_PROXY: http://api:8770
      VITE_RAG_API_PROXY: http://rag-api:8001
      # node:22-alpine defaults HOME to /root, which a non-root DOCKER_UID cannot
      # write; without these npm install fails on its cache before it starts.
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    ports:
      - "127.0.0.1:5274:5274"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # Vendored Aion-RAG backend (Knowledge tabs). Own image: fastapi/uvicorn pins
  # conflict with the qlib API, and docling stays out of backtests. Talks to
  # Supabase via host.docker.internal:8010. Config: rag/backend/.env.
  rag-api:
    build:
      context: ./rag/backend
    image: ${AION_RAG_IMAGE:-aion-rag:dev}
    container_name: qlib-rag-api
    working_dir: /rag/backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOME: /home/rag
      HF_HOME: /home/rag/.cache/huggingface
    env_file:
      - path: rag/backend/.env
        required: false
    volumes:
      - ./rag:/rag
      - rag-model-cache:/home/rag/.cache
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Scalability agent. Same image and env as api; it polls aion.scalability_jobs
  # and writes reports back. The API only enqueues.
  agent:
    image: ${AION_IMAGE:-ghcr.io/tbvisser/aion-qlib:dev}
    container_name: qlib-scalability-agent
    working_dir: /qlib
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOME: /home/qlib
    env_file:
      - path: webapp/.env
        required: false
    volumes:
      - .:/qlib
      - ${HOME}/.qlib:/home/qlib/.qlib
    ports:
      - "127.0.0.1:8771:8771"
    command: python -m scalability_agent.agent.main

  # Vibe-Trading sidecar (HKUDS/Vibe-Trading, MIT — THIRD_PARTY_NOTICES.md).
  # Own image for the same reason as rag-api. The qlib API proxies a whitelist
  # at /api/vibe/*. Config: vibe/.env — API_AUTH_KEY must match VIBE_API_TOKEN
  # in webapp/.env.
  vibe-api:
    build:
      context: ./vibe
    image: ${AION_VIBE_IMAGE:-aion-vibe:dev}
    container_name: qlib-vibe-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: vibe/.env
        required: false
    volumes:
      - vibe-home:/home/vibe
    ports:
      - "127.0.0.1:8899:8000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2
    command:
      - vibe-trading
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Same image, MCP transport. Internal-only; consumers are the qlib API proxy
  # and rag-api (MCP_SERVERS in rag/backend/.env).
  vibe-mcp:
    image: ${AION_VIBE_IMAGE:-aion-vibe:dev}
    container_name: qlib-vibe-mcp
    depends_on:
      - vibe-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: vibe/.env
        required: false
    environment:
      VIBE_TRADING_MCP_ALLOWED_HOSTS: vibe-mcp,localhost,127.0.0.1
    volumes:
      - vibe-home:/home/vibe
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2
    command:
      - vibe-trading-mcp
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "8900"

volumes:
  rag-model-cache:
  vibe-home:
