# The AION platform: backend API + Vite frontend, with Supabase for auth and
# Postgres. Start just the platform with:
#
#   docker compose up -d api ui
#
# Optional dev/utility services (RAG, Vibe, agent, Jupyter, MLflow, and the qlib
# dev shell) live in docker-compose.dev.yml. To start everything together:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Supabase is pulled in from infra/supabase/ so the whole project stays one
# compose project: one network, one stack in Docker Desktop.
#
#   docker compose pull                # fetch the published image (fast path)
#   docker compose build api           # ...or build it yourself, ~5-8 min
#   docker compose up -d api ui        # start only the platform
#   docker compose exec api bash       # shell in the API container
#   docker compose exec -w /qlib/examples api \
#       qrun benchmarks/LightGBM/workflow_config_lightgbm_Alpha158.yaml
#   open http://localhost:5274         # AION UI
#   open http://localhost:8770/api/health
#
# The repo is bind-mounted, so host edits are live inside the container via the
# editable install. ~/.qlib is shared, so host and container use one dataset.
#
# First run on a new machine: see ONBOARDING.md. Requires Compose v2.24+ for the
# optional `env_file` form used below.
#
# AION_IMAGE selects which image the python services run. The default is the
# one CI publishes to GHCR; `AION_IMAGE=qlib-dev:local` pins to your own build.
# DOCKER_UID/DOCKER_GID matter on Linux only — see .env.example.
#
# The data mount lands on /home/qlib/.qlib rather than /root/.qlib, and HOME is
# set to match, so that `~/.qlib` still resolves when DOCKER_UID makes these
# services run as a non-root user (/root is mode 700 and unreadable to them).

# Supabase -- auth and the Postgres every user record lives in -- is pulled in
# here so the whole platform is ONE compose project: one `docker compose up`,
# one stack in Docker Desktop, one network.
#
# `project_directory` is what makes it safe: Supabase's compose uses relative
# bind mounts (./volumes/db/data is the database), and without it they would
# resolve against this file's directory and Postgres would start on an empty
# data dir. `env_file` supplies the ~100 variables its services read, which
# live in its own .env rather than ours.
#
# Its two named volumes are re-declared as external at the bottom of this file.
# That is not optional -- see the comment there.
include:
  - path: ./infra/supabase/docker-compose.yml
    project_directory: ./infra/supabase
    env_file: ./infra/supabase/.env

services:
  # AION API. Built from Dockerfile.dev unless AION_IMAGE points to a published
  # image. Needs the repo (editable install), ~/.qlib (market data) and
  # webapp/.env (EODHD + OpenRouter keys, which stay server-side and never reach
  # the browser).
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: ${AION_IMAGE:-ghcr.io/tbvisser/aion-qlib:dev}
    container_name: qlib-api
    depends_on:
      db:
        condition: service_healthy
    working_dir: /qlib
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    environment:
      HOME: /home/qlib
    # The keys are read at runtime, never baked into the image — see the secrets
    # block in Dockerfile.dev.dockerignore. Optional so that `compose up` still
    # works on a fresh clone before you have written webapp/.env.
    env_file:
      - path: webapp/.env
        required: false
    volumes:
      - .:/qlib
      - ${HOME}/.qlib:/home/qlib/.qlib
    ports:
      - "127.0.0.1:8770:8770"
    # Per-user records live in Supabase's Postgres, which is now a service in
    # this same project -- so this reaches it directly on the shared default
    # network as supabase-db-aq:5432, rather than going out to the host and
    # back in through the supavisor pooler (which would also mean adopting
    # supavisor's user.tenant username form and transaction-mode limits).
    command:
      - uvicorn
      - webapp.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8770"

  # Vite dev server. Proxies /api to the api service (VITE_API_PROXY overrides
  # the localhost default from vite.config.ts, since inside the network the API
  # is reachable by service name rather than on 127.0.0.1).
  ui:
    image: node:22-alpine
    container_name: qlib-ui
    depends_on:
      - api
    working_dir: /app
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    volumes:
      - ./webapp/ui:/app
    environment:
      VITE_API_PROXY: http://api:8770
      # node:22-alpine defaults HOME to /root, which a non-root DOCKER_UID cannot
      # write; without these npm install fails on its cache before it starts.
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    ports:
      - "127.0.0.1:5274:5274"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  # Supabase's own two volumes, pinned to the names they already have.
  #
  # Compose prefixes a named volume with the project name, so folding these
  # services in would otherwise point them at fresh, empty `aion-qlib_*`
  # volumes. That is not a cosmetic difference: db-config holds
  # `pgsodium_root.key`, the root encryption key for Vault. An empty volume
  # means Postgres starts with no custom config and mints a NEW key, at which
  # point anything encrypted under the old one is unrecoverable.
  #
  # `external: true` means compose attaches to these and never creates or
  # removes them -- including on `docker compose down -v`.
  db-config:
    external: true
    name: supabase-aq_db-config
  deno-cache:
    external: true
    name: supabase-aq_deno-cache
